[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vyaparsense-ml"
version = "0.1.0"
description = "Forecasting & replenishment library for VyaparSense"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "VyaparSense" }]
dependencies = [
    "pydantic>=2.7",
    # Heavier deps (pandas, statsforecast, lightgbm) are added in the feature
    # PR that first uses them, to keep installs lean.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vyaparsense_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["vyaparsense_ml"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
