[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vyaparsense-ml"
version = "0.1.0"
description = "Forecasting & replenishment library for VyaparSense"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "VyaparSense" }]
dependencies = [
    "pydantic>=2.7",
    # Classical forecasting (Phase 3): ETS / AutoARIMA. Pulls numpy transitively
    # but we import it directly, so it is declared explicitly.
    "statsforecast>=2.0",
    "numpy>=1.26",
    # Feature engineering for the global model (Phase 4). statsforecast already
    # pulls pandas, but features.py imports it directly so it is declared here.
    "pandas>=2.0",
    # Heavier deps (lightgbm) are added in the feature PR that first uses them.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned so local == CI (drift here caused green-local/red-CI in Phase 1).
    "ruff==0.15.15",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vyaparsense_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["vyaparsense_ml"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
