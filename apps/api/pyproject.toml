[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vyaparsense-api"
version = "0.1.0"
description = "FastAPI backend for VyaparSense"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    # Custom auth (ADR-006): Argon2id password hashing + JWT tokens.
    "argon2-cffi>=23",
    "pyjwt>=2.8",
    # Async forecast jobs (ADR-007/011): RQ over Redis, with an inline fallback.
    "rq>=1.16",
    "redis>=5",
    "vyaparsense-ml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Pinned so local == CI (drift here caused green-local/red-CI in Phase 1).
    "ruff==0.15.15",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
